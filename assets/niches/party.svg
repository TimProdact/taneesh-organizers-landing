<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="150" y1="0" x2="150" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18121c"/>
      <stop offset="1" stop-color="#0a080c"/>
    </linearGradient>
    <radialGradient id="party-glow" cx="150" cy="100" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1ed760" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#1ed760" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg)"/>
  <rect width="300" height="400" fill="url(#party-glow)"/>
  <!-- disco ball -->
  <circle cx="150" cy="90" r="45" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="150" y1="0" x2="150" y2="45" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- disco ball facets -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="0.8" fill="none">
    <line x1="150" y1="55" x2="150" y2="135"/><line x1="105" y1="90" x2="195" y2="90"/>
    <line x1="118" y1="68" x2="182" y2="132"/><line x1="182" y1="68" x2="118" y2="132"/>
  </g>
  <circle cx="150" cy="90" r="6" fill="#1ed760" opacity="0.6"/>
  <!-- light rays -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="150" y1="135" x2="80" y2="200"/><line x1="150" y1="135" x2="220" y2="200"/>
    <line x1="150" y1="135" x2="60" y2="250"/><line x1="150" y1="135" x2="240" y2="250"/>
    <line x1="150" y1="135" x2="100" y2="300"/><line x1="150" y1="135" x2="200" y2="300"/>
  </g>
  <!-- dancers -->
  <g fill="rgba(255,255,255,0.08)">
  <!-- dancer 1 -->
    <circle cx="90" cy="240" r="18"/>
    <path d="M65 290 Q90 260 115 290 L110 340 L70 340 Z"/>
  <!-- dancer 2 -->
    <circle cx="210" cy="235" r="20"/>
    <path d="M182 285 Q210 255 238 285 L232 345 L188 345 Z"/>
  </g>
  <!-- raised arms -->
  <line x1="75" y1="260" x2="60" y2="220" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="255" x2="120" y2="215" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="255" x2="180" y2="210" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round"/>
  <line x1="225" y1="260" x2="240" y2="218" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round"/>
  <!-- cocktail glass -->
  <path d="M150 310 L135 350 L165 350 Z" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="150" y1="310" x2="150" y2="295" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <ellipse cx="150" cy="295" rx="18" ry="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="155" cy="320" r="4" fill="#9fe870" opacity="0.5"/>
  <!-- confetti -->
  <rect x="40" y="160" width="6" height="6" rx="1" fill="rgba(255,255,255,0.15)" transform="rotate(25 43 163)"/>
  <rect x="250" y="180" width="5" height="5" rx="1" fill="#1ed760" opacity="0.4" transform="rotate(-15 252 182)"/>
  <circle cx="270" cy="130" r="3" fill="rgba(255,255,255,0.12)"/>
  <circle cx="35" cy="200" r="2.5" fill="#9fe870" opacity="0.4"/>
</svg>
