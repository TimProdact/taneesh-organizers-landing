<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="300" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161618"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg)"/>
  <!-- table surface -->
  <path d="M30 220 L270 220 L290 280 L10 280 Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="30" y1="220" x2="10" y2="280" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="270" y1="220" x2="290" y2="280" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- tools on table -->
  <rect x="55" y="235" width="50" height="35" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="65" y1="245" x2="95" y2="245" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="65" y1="255" x2="85" y2="255" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- paintbrush -->
  <line x1="130" y1="250" x2="130" y2="210" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
  <path d="M122 210 Q130 195 138 210 L135 218 Q130 222 125 218 Z" fill="#1ed760" opacity="0.7"/>
  <!-- palette -->
  <ellipse cx="200" cy="250" rx="30" ry="22" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="190" cy="245" r="5" fill="rgba(255,255,255,0.15)"/>
  <circle cx="205" cy="240" r="4" fill="#9fe870" opacity="0.6"/>
  <circle cx="210" cy="255" r="4" fill="rgba(255,255,255,0.1)"/>
  <!-- instructor -->
  <circle cx="150" cy="130" r="28" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <path d="M110 175 Q150 155 190 175 L185 210 Q150 195 115 210 Z" fill="rgba(255,255,255,0.06)"/>
  <!-- pointing hand -->
  <path d="M195 175 L230 160 L225 170 L240 168 L220 185 L225 195" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- participants -->
  <g fill="rgba(255,255,255,0.05)">
    <circle cx="70" cy="310" r="16"/><circle cx="150" cy="320" r="14"/><circle cx="230" cy="310" r="16"/>
  </g>
  <rect x="50" y="340" width="40" height="6" rx="3" fill="rgba(255,255,255,0.04)"/>
  <rect x="130" y="348" width="40" height="6" rx="3" fill="rgba(255,255,255,0.04)"/>
  <rect x="210" y="340" width="40" height="6" rx="3" fill="rgba(255,255,255,0.04)"/>
  <!-- light bulb idea -->
  <circle cx="150" cy="55" r="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <path d="M142 70 L142 78 L158 78 L158 70" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none"/>
  <line x1="145" y1="82" x2="155" y2="82" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <path d="M150 40 L150 30 M135 45 L128 38 M165 45 L172 38" stroke="#9fe870" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
