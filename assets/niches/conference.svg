<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141820"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg)"/>
  <!-- grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="300" y2="80"/><line x1="0" y1="160" x2="300" y2="160"/>
    <line x1="0" y1="240" x2="300" y2="240"/><line x1="0" y1="320" x2="300" y2="320"/>
    <line x1="75" y1="0" x2="75" y2="400"/><line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="225" y1="0" x2="225" y2="400"/>
  </g>
  <!-- presentation screen -->
  <rect x="55" y="55" width="190" height="115" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <rect x="70" y="75" width="80" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="70" y="90" width="120" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <!-- chart on screen -->
  <rect x="70" y="105" width="160" height="70" rx="4" fill="rgba(255,255,255,0.04)"/>
  <polyline points="85,155 110,130 135,140 160,110 185,125 210,95" stroke="#1ed760" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="210" cy="95" r="4" fill="#1ed760"/>
  <!-- podium -->
  <path d="M115 200 L115 280 L185 280 L185 200 Z" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <rect x="125" y="210" width="50" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  <!-- speaker silhouette -->
  <circle cx="150" cy="175" r="18" fill="rgba(255,255,255,0.12)"/>
  <path d="M128 200 L128 215 Q150 205 172 215 L172 200" fill="rgba(255,255,255,0.08)"/>
  <!-- audience rows -->
  <g>
    <rect x="40" y="300" width="220" height="8" rx="4" fill="rgba(255,255,255,0.05)"/>
    <rect x="50" y="318" width="200" height="8" rx="4" fill="rgba(255,255,255,0.04)"/>
    <rect x="60" y="336" width="180" height="8" rx="4" fill="rgba(255,255,255,0.03)"/>
    <rect x="70" y="354" width="160" height="8" rx="4" fill="rgba(255,255,255,0.02)"/>
  </g>
  <!-- wifi/signal accent -->
  <path d="M250 50 Q260 60 250 70" stroke="#9fe870" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M258 42 Q272 56 258 70" stroke="#9fe870" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
</svg>
